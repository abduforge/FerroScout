[package]
name = "ferroscout"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "A local-first Rust SAST scanner with text, Markdown, JSON, and SARIF reports"
license = "MIT"
repository = "https://github.com/abduforge/FerroScout"
readme = "README.md"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
regex = "=1.10.4"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"

[profile.release]
lto = true
codegen-units = 1
strip = true
