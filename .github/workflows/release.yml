name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify tag and package version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG_VERSION" || {
            echo "Tag $TAG_VERSION does not match Cargo.toml version $VERSION" >&2
            exit 1
          }
      - name: Test and build
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist/ferroscout
          install -m 0755 target/release/ferroscout dist/ferroscout/ferroscout
          cp README.md README_RU.md CHANGELOG.md LICENSE dist/ferroscout/
          ARCHIVE="ferroscout-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C dist -czf "dist/$ARCHIVE" ferroscout
          cd dist
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: FerroScout ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
